# coturn 配置参考（裸机 / systemd 部署用）。
#
# ⚠️ coturn **不支持**在配置文件里读环境变量，所以下面这些占位符需要替换成真实值；
#    用 docker compose 部署时请走 compose.prod.yml 里的命令行参数（同一个配置文件
#    在容器里不方便做变量替换，命令行更直接）。
#
# 本文件与 compose 里的参数保持一一对应，便于对照排查。

# ---- 监听 ----
listening-port=3478
# TLS 监听（可选）。要启用需要把证书路径配上，并在安全组开放 5349/tcp
#tls-listening-port=5349

# ---- 对外地址（云服务器必须显式指定）----
# 与 SFU_ADVERTISE_IP 同理：多网卡时 coturn 自动探测到的很可能是内网地址
external-ip=YOUR_PUBLIC_IP

# ---- 认证：临时凭证（REST API 方案）----
# 关键点：**不要**用静态用户名/密码。用共享密钥让服务端现签临时凭证，
# 服务端侧由本项目的 /ice 端点下发（HMAC-SHA1），coturn 用同一个密钥校验。
realm=sfu.example.com
use-auth-secret
static-auth-secret=YOUR_TURN_SECRET

# ---- 中继端口段（安全组要开放这段 UDP）----
min-port=49160
max-port=49200

# ---- 加固 ----
fingerprint
no-multicast-peers
no-cli
# 关掉老版本 TLS
no-tlsv1
no-tlsv1_1
# 生产可以关掉明文 UDP/TCP 中继，只留 TLS（客户端需改用 turns:）
#no-udp-relay
#no-tcp-relay

# ---- 限流（防止中继被当免费代理刷爆）----
user-quota=12
total-quota=1200
max-bps=1000000

# ---- 日志 ----
log-file=stdout
simple-log
