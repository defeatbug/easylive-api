# 基础服务定义：dev container（.devcontainer/docker-compose.yml）与部署编排都会引用本文件。
# 约定与 ~/codes/egg/egg-api/compose.yml 一致：卷统一放 ${DOCKER_VOLUMES_ROOT_DIR}，日志滚动限制。
#
# 注意：本项目的业务决策是「单节点、会话状态驻留内存」，因此这里不提供 redis 服务。
#       若将来引入多节点房间路由，再按 egg-api 的写法把 redis 服务加回来。
services:
  postgresql:
    image: postgres:17.2-alpine3.20
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME:-postgres}
    volumes:
      - ${DOCKER_VOLUMES_ROOT_DIR}/postgresql_volume/data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # coturn：仅在需要本地验证中继（强制 relay）时启用。
