# easylive 宿主机 nginx：伺服前端静态站 + 反代 API（信令/HTTP）。
#
# 放置：/opt/easylive/nginx/easylive.conf，软链到 /etc/nginx/sites-enabled/（Debian/Ubuntu）：
#   sudo ln -s /opt/easylive/nginx/easylive.conf /etc/nginx/sites-enabled/easylive.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS 由 NPM 终止（hjy.dmmcloud.com → 本机 :80），这里只监听 80。
# 前端与 API 同源：页面里的 /ws、/token、/ice 都是相对地址，无需额外配置。
# 反代端口 3000 须与 api 的 APP_PORT 一致。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /opt/easylive/web;
    index index.html;

    # SPA：刷新子路径回退到 index.html，否则刷新子路径会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 信令 WebSocket ----
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：长连接不能被反代单方面掐断（心跳是 30s）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- HTTP API：令牌 / ICE 配置 / GraphQL / 健康检查 ----
    location ~ ^/(token|ice|graphql|healthz)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
